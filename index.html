<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@500;700&family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E6E9EE;
    --panel: #F7F8FA;
    --ink: #1B2233;
    --muted: #5E6779;
    --cobalt: #2445A8;
    --cobalt-press: #1A3480;
    --signal: #F2B705;
    --on-cobalt: #FFFFFF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151A24;
      --panel: #1E2532;
      --ink: #E9ECF2;
      --muted: #9AA3B5;
      --cobalt: #4C6FE0;
      --cobalt-press: #3A5BC4;
      --signal: #F5C431;
      --on-cobalt: #FFFFFF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151A24;
    --panel: #1E2532;
    --ink: #E9ECF2;
    --muted: #9AA3B5;
    --cobalt: #4C6FE0;
    --cobalt-press: #3A5BC4;
    --signal: #F5C431;
    --on-cobalt: #FFFFFF;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    height: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0;
  }
  .reset {
    font: inherit;
    font-size: 0.95rem;
    color: var(--muted);
    background: none;
    border: 1.5px solid currentColor;
    border-radius: 999px;
    padding: 0.35rem 0.9rem;
    cursor: pointer;
  }
  .reset:hover { color: var(--ink); }

  .window {
    background: var(--panel);
    border-radius: 18px;
    padding: 1.5rem 1rem;
    text-align: center;
    border-bottom: 6px solid var(--signal);
  }
  .count {
    font-family: "Azeret Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-weight: 700;
    font-size: clamp(4.5rem, 26vw, 7.5rem);
    line-height: 1;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    display: inline-block;
  }
  .count.bump { animation: bump 160ms ease-out; }
  @keyframes bump {
    0% { transform: translateY(-6px); opacity: 0.6; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .tap {
    flex: 1;
    min-height: 180px;
    font: inherit;
    font-family: "Azeret Mono", ui-monospace, Menlo, monospace;
    font-size: 4rem;
    font-weight: 500;
    color: var(--on-cobalt);
    background: var(--cobalt);
    border: none;
    border-radius: 28px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    box-shadow: 0 8px 0 var(--cobalt-press);
    transition: transform 70ms, box-shadow 70ms;
  }
  .tap:active, .tap.pressed {
    transform: translateY(6px);
    box-shadow: 0 2px 0 var(--cobalt-press);
  }
  .minus {
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--panel);
    border: none;
    border-radius: 14px;
    padding: 0.9rem;
    cursor: pointer;
  }
  .minus:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible {
    outline: 3px solid var(--signal);
    outline-offset: 3px;
  }
  .hint {
    margin: 0;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
  }
  @media (prefers-reduced-motion: reduce) {
    .count.bump { animation: none; }
    .tap { transition: none; }
  }
  @media (hover: none) { .hint { display: none; } }
</style>
</head>
<body>
  <main class="app">
    <div class="top">
      <h1>Tap Counter</h1>
      <button class="reset" id="reset" type="button">Reset</button>
    </div>

    <div class="window">
      <span class="count" id="count" aria-live="polite">0</span>
    </div>

    <button class="tap" id="tap" type="button" aria-label="Add one">+</button>
    <button class="minus" id="minus" type="button">Take one away</button>
    <p class="hint">Press the space bar to add one.</p>
  </main>

<script>
  const KEY = "tap-counter-value";
  const countEl = document.getElementById("count");
  const tapBtn = document.getElementById("tap");
  const minusBtn = document.getElementById("minus");
  const resetBtn = document.getElementById("reset");

  let count = 0;
  try {
    const saved = parseInt(localStorage.getItem(KEY), 10);
    if (!Number.isNaN(saved) && saved >= 0) count = saved;
  } catch (e) {}

  function render(animate) {
    countEl.textContent = count.toLocaleString();
    minusBtn.disabled = count === 0;
    if (animate) {
      countEl.classList.remove("bump");
      void countEl.offsetWidth;
      countEl.classList.add("bump");
    }
    try { localStorage.setItem(KEY, String(count)); } catch (e) {}
  }

  function add() {
    count += 1;
    render(true);
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  }

  tapBtn.addEventListener("click", add);
  minusBtn.addEventListener("click", () => {
    if (count > 0) { count -= 1; render(true); }
  });
  resetBtn.addEventListener("click", () => {
    if (count === 0) return;
    if (confirm("Reset the count to 0?")) { count = 0; render(true); }
  });

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !(e.target instanceof HTMLButtonElement)) {
      e.preventDefault();
      tapBtn.classList.add("pressed");
      add();
    }
  });
  document.addEventListener("keyup", (e) => {
    if (e.code === "Space") tapBtn.classList.remove("pressed");
  });

  render(false);
</script>
</body>
</html>
